<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <title>Entre Estrelas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/portal.css?v=20261124-presente-gratis">
</head>
<body>
  <header class="portal-topo">
<a href="index.html" aria-label="Entre Estrelas, início"><img src="fonts/Logo%205%20Pontas%20SEM%20texto.png" alt="Entre Estrelas"></a>
    <nav>
      <a href="index.html">Site</a>
      <a href="minha-area.html" id="link-area">Minha área</a>
    </nav>
  </header>

  <section class="pagina-produto-topo">
    <div class="ceu" aria-hidden="true">
      <div class="ceu-estrelas ceu-estrelas--longe"></div>
      <div class="ceu-estrelas ceu-estrelas--perto"></div>
      <div class="ceu-planeta ceu-planeta--anel"></div>
      <div class="ceu-planeta ceu-planeta--pequeno"></div>
      <div class="ceu-vidro"></div>
    </div>
    <div class="pagina-produto-chamada" id="chamada">
      <p class="pagina-produto-tipo">Carregando…</p>
    </div>
  </section>

  <main class="pagina-produto-corpo">
    <article class="cartao pagina-produto-texto" id="texto" hidden></article>
    <p class="aviso" id="aviso" role="status"></p>
  </main>

  <script type="module">
    import {
      configurado, sessaoAtual, meuCadastro, meusProdutos, minhasAssinaturas, inscrever, cancelarInscricao,
      produtoDaPagina, textoDaPagina, iconeProduto, imagemProduto, escapar, formatarPreco, presentearGratis, linkDePresente
    } from './js/portal.js?v=20261124-miniaturas';

    const parametros = new URLSearchParams(location.search);
    const slug = (parametros.get('p') || '').trim();
    const chamada = document.querySelector('#chamada');
    const aviso = document.querySelector('#aviso');
    const mostrar = (texto, tipo) => { aviso.textContent = texto; aviso.className = `aviso aviso-${tipo}`; };
    const tipos = { live: 'Live', aula: 'Aula', produto: 'Análise', vivencia: 'Vivência', formacao: 'Para profissionais', ferramenta: 'Comece agora' };
    const aqui = `produto.html?p=${encodeURIComponent(slug)}`;
    const entrarE = (destino) => `entrar.html?voltar=${encodeURIComponent(destino)}`;

    async function iniciar() {
      if (!configurado) return mostrar('O portal está sendo configurado. Volte em breve.', 'info');
      const p = slug ? await produtoDaPagina(slug) : null;
      if (!p) {
        chamada.innerHTML = '<h1>Página não encontrada</h1><p class="pagina-produto-slogan">Confira se o link foi copiado inteiro.</p>';
        return;
      }
      document.title = `${p.nome} — Entre Estrelas`;
      document.body.classList.add(`pagina-produto--${p.slug}`); // arte própria de cada produto (ver portal.css)

      // Quem já entrou: vê se já está inscrito(a) ou se já tem o produto
      const logado = Boolean(await sessaoAtual());
      let cliente = null, meu = null, membro = false;
      if (logado) {
        cliente = await meuCadastro().catch(() => null);
        if (cliente) {
          const [produtos, assinaturas] = await Promise.all([
            meusProdutos().catch(() => []), minhasAssinaturas(cliente.id).catch(() => [])
          ]);
          meu = produtos.find((x) => x.id === p.id) || null;
          membro = assinaturas.length > 0;
        }
      }

      const emBreve = p.status === 'em_breve';
      // Ainda sem preço e sem data próxima: o botão é para ser avisado(a), não para participar
      const marcada = Boolean(p.preco_centavos) || Boolean(p.previsao && (new Date(`${p.previsao}T00:00:00`) - new Date()) / 864e5 < 45);
      const rotuloParticipar = marcada ? '★ Quero participar' : '★ Quero ser avisado(a)';
      // Perto: dia e mês. Longe: só o mês e o ano (a data exata ainda pode mudar).
      const quando = p.previsao
        ? new Date(`${p.previsao}T00:00:00`).toLocaleDateString('pt-BR', (new Date(`${p.previsao}T00:00:00`) - new Date()) / 864e5 < 45
          ? { day: 'numeric', month: 'long' } : { month: 'long', year: 'numeric' })
        : '';

      // Inscrição automática quando a pessoa clicou em "Quero participar" antes de entrar
      if (emBreve && cliente && !meu?.inscrito &&p.inscricoes_abertas && parametros.get('participar') === '1') {
        await inscrever(cliente.id, p.id).then(() => { meu.inscrito = true; }).catch(() => {});
        history.replaceState(null, '', aqui);
      }

      const aberto = ['aberto', 'cadastro'].includes(p.nivel);
      // Mostra o link do presente gerado, com WhatsApp e copiar
      const caixaPresente = (codigo) => {
        const link = linkDePresente(codigo);
        const texto = encodeURIComponent(`Tenho um presente para você ★ ${p.nome}, do Entre Estrelas. Abra este link para receber: ${link}`);
        return `<div class="presente-gerado" role="status">
          <strong>🎁 Seu presente está pronto!</strong>
          <span>Envie o link para quem você quiser. A pessoa entra com o e-mail dela e recebe na hora.</span>
          <div class="presente-gerado-acoes">
            <a class="portal-entrada-botao portal-entrada-botao--principal" href="https://wa.me/?text=${texto}" target="_blank" rel="noopener noreferrer">Enviar pelo WhatsApp</a>
            <button class="portal-entrada-botao portal-entrada-botao--contorno" data-copiar-link="${escapar(link)}">Copiar link</button>
          </div>
          <span class="presente-gerado-nota">Você encontra este presente também em Minha área → Meus presentes.</span>
        </div>`;
      };
      const acoes = () => {
        const presentear = () => {
          // Conteúdo aberto (Comece agora): presente sem pagamento, gerado na hora
          if (aberto) {
            return cliente
              ? '<button class="portal-entrada-botao portal-entrada-botao--contorno" data-presentear-gratis>🎁 Presentear alguém</button>'
              : `<a class="portal-entrada-botao portal-entrada-botao--contorno" href="${entrarE(`${aqui}&presentear=1`)}">🎁 Presentear alguém</a>`;
          }
          if (!p.permite_presente || !p.preco_centavos) return '';
          const preco = membro && p.preco_presente_membro_centavos ? p.preco_presente_membro_centavos : p.preco_centavos;
          const destino = `minha-area.html?presentear=${encodeURIComponent(p.slug)}`;
          return `<a class="portal-entrada-botao portal-entrada-botao--contorno" href="${cliente ? destino : entrarE(destino)}">🎁 Dar de presente · ${formatarPreco(preco)}</a>`;
        };
        // Lançamento pago para quem ainda não tem: compra (que já inscreve) ou presente
        if (emBreve && p.preco_centavos && cliente && !meu?.liberado) {
          return `<a class="portal-entrada-botao portal-entrada-botao--principal" href="minha-area.html?comprar=${encodeURIComponent(p.slug)}">★ Quero participar · ${formatarPreco(p.preco_centavos)}</a>${presentear()}`;
        }
        if (emBreve) {
          if (!p.inscricoes_abertas) return '<span class="pagina-produto-selo">Inscrições em breve</span>';
          if (meu?.inscrito) {
            return `<div class="inscricao-ok" role="status"><strong>✓ Inscrição confirmada!</strong>
              <span>Antes ${quando ? `de ${escapar(quando)}` : 'do lançamento'}, vamos te enviar por WhatsApp e e-mail as informações para participar.</span></div>
              <button class="pagina-produto-link" data-cancelar>Cancelar inscrição</button>${presentear()}`;
          }
          return cliente
            ? `<button class="portal-entrada-botao portal-entrada-botao--principal" data-participar>${rotuloParticipar}</button>${presentear()}`
            :`<a class="portal-entrada-botao portal-entrada-botao--principal" href="${entrarE(`${aqui}&participar=1`)}">${rotuloParticipar}${p.preco_centavos ? ` · ${formatarPreco(p.preco_centavos)}` : ''}</a>${presentear()}
               ${p.preco_centavos ? '<p class="pagina-produto-nota">Membro Fundador? Entre com o seu e-mail: já está incluído no seu pacote de Membro Fundador.</p>' : ''}`;
        }
        const botoes = [];
        if (meu?.liberado) {
          botoes.push('<a class="portal-entrada-botao portal-entrada-botao--principal" href="minha-area.html">✓ Já faz parte da sua jornada</a>');
        } else if (p.preco_centavos) {
          const destino = `minha-area.html?comprar=${encodeURIComponent(p.slug)}`;
          const meuPreco = membro && p.preco_membro_centavos ? p.preco_membro_centavos : p.preco_centavos;
          botoes.push(`<a class="portal-entrada-botao portal-entrada-botao--principal" href="${cliente ? destino : entrarE(destino)}">Quero este · ${formatarPreco(meuPreco)}</a>`);
        }
        botoes.push(presentear());
        return botoes.join('');
      };

      const desenhar = () => {
        const linhaTipo = emBreve
          ? `${escapar(tipos[p.tipo] || 'Novidade')}${quando ? ` · ${escapar(quando)}` : ''}`
          : (p.versao ? `Versão ${escapar(p.versao)}` : 'Entre Estrelas');
        chamada.innerHTML = `
          <div class="pagina-produto-icone">${iconeProduto(p.icone || 'estrela')}</div>
          <p class="pagina-produto-tipo">${linhaTipo}</p>
          <h1>${escapar(p.nome)}</h1>
          ${p.slogan ? `<p class="pagina-produto-slogan">${escapar(p.slogan)}</p>` : ''}
          ${p.descricao ? `<p class="pagina-produto-resumo">${escapar(p.descricao)}</p>` : ''}
          <div class="pagina-produto-acoes">${acoes()}</div>`;
      };
      desenhar();

      // Texto longo (ou, se ainda não houver, as novidades da versão)
      const novidades = String(p.novidades || '').split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      const corpo = p.pagina
        ? textoDaPagina(p.pagina)
        : novidades.length ? `<h2>O que há de novo</h2><ul>${novidades.map((n) => `<li>${escapar(n)}</li>`).join('')}</ul>` : '';
      if (corpo) {
        const texto = document.querySelector('#texto');
        // A ilustração abre a explicação (no cartão claro, combina com a aquarela)
        const ilustracao = imagemProduto(p.slug)
          ? `<img class="pagina-produto-imagem" src="${imagemProduto(p.slug)}" alt="${escapar(p.nome)}">` : '';
        // Black Friday (até 30/11): convite para a jornada completa, só na página do Mapa da Vida
        const fundadorAberto = p.slug === 'mapa-da-vida' && new Date() < new Date('2026-12-01T00:00:00-03:00') && !membro;
        const blocoFundador = fundadorAberto ? `<section class="bloco-fundador-bf">
            <p class="bloco-fundador-bf-selo">★ Black Friday · só até 30/11</p>
            <h2>Quer a jornada completa?</h2>
            <p>Seja <strong>Membro Fundador</strong> por <strong>R$ 49,85, valor único</strong>: o seu Mapa da Vida, o Mapa do Ano antes de todo mundo, a Árvore de Natal com Raízes, voto nos próximos passos e acesso a tudo o que vem pela frente.</p>
            <p><strong>E mais: um Mapa da Vida para você presentear quem quiser.</strong></p>
            <a class="portal-entrada-botao portal-entrada-botao--principal" href="minha-area.html?comprar=membro-fundador">⭐ Quero ser Membro Fundador</a>
          </section>` : '';
        texto.innerHTML = ilustracao + corpo + `<div class="pagina-produto-fim"><div class="pagina-produto-acoes">${acoes()}</div></div>` + blocoFundador;
        texto.hidden = false;
      }

      // Veio de "Presentear" antes de entrar: gera o presente assim que entra
      if (aberto && cliente && parametros.get('presentear') === '1') {
        history.replaceState(null, '', aqui);
        presentearGratis(p.slug).then((codigo) => {
          document.querySelector('.pagina-produto-acoes')?.insertAdjacentHTML('afterend', caixaPresente(codigo));
        }).catch((e) => mostrar(e.message, 'erro'));
      }

      document.body.addEventListener('click', async (evento) => {
        const copiar = evento.target.closest('[data-copiar-link]');
        if (copiar) {
          await navigator.clipboard.writeText(copiar.dataset.copiarLink).catch(() => {});
          copiar.textContent = 'Link copiado ✓';
          return;
        }
        const presente = evento.target.closest('[data-presentear-gratis]');
        if (presente && cliente) {
          presente.disabled = true;
          try {
            const codigo = await presentearGratis(p.slug);
            presente.closest('.pagina-produto-acoes').insertAdjacentHTML('afterend', caixaPresente(codigo));
          } catch (e) {
            mostrar(e.message, 'erro');
          } finally {
            presente.disabled = false;
          }
          return;
        }
        const alvo = evento.target.closest('[data-participar], [data-cancelar]');
        if (!alvo || !cliente) return;
        alvo.disabled = true;
        try {
          if (alvo.hasAttribute('data-participar')) await inscrever(cliente.id, p.id);
          else await cancelarInscricao(cliente.id, p.id);
          meu = { ...(meu || {}), inscrito: alvo.hasAttribute('data-participar') };
          desenhar();
          const fim = document.querySelector('.pagina-produto-fim .pagina-produto-acoes');
          if (fim) fim.innerHTML = acoes();
        } catch (e) {
          mostrar(e.message, 'erro');
          alvo.disabled = false;
        }
      });
    }

    iniciar().catch((e) => mostrar(e.message, 'erro'));
  </script>
</body>
</html>
